services:
  - type: web
    name: sparked-frontend
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://sparked-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://sparked-backend.onrender.com
