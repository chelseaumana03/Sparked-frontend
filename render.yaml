services:
  - type: web
    name: sparked-frontend
    runtime: node
    plan: starter
    region: virginia
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # API_URL, NEXT_PUBLIC_API_URL, FRONTEND_URL come from a shared group.
      # Values are managed in Render Dashboard -> Environment Groups -> sparked-urls
      # so both frontend and backend read the same URLs without hardcoding them here.
      - fromGroup: sparked-urls
