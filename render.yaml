services:
  - type: web
    name: sparked-frontend
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # API_URL, NEXT_PUBLIC_API_URL, FRONTEND_URL — из общей группы sparked-urls
      # Значения задаются в Render Dashboard → Environment Groups → sparked-urls,
      # чтобы и фронт, и бэк читали один и тот же адрес без хардкода в файле.
      - fromGroup: sparked-urls
